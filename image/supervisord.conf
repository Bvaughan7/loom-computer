; Process tree of the computer. Everything runs as the unprivileged agent
; user (the image's USER); nothing here needs or asks for root.
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; The API holds the token. The desktop processes (and anything the agent starts
; from them) must not inherit it, so each strips it from its environment.
[program:xvfb]
command=env -u LOOM_COMPUTER_TOKEN Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=python -m loom_computer
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=env -u LOOM_COMPUTER_TOKEN /opt/loom-computer/image/wait-for-x openbox --config-file /opt/loom-computer/image/openbox-rc.xml
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chromium]
environment=DBUS_SESSION_BUS_ADDRESS="unix:path=/nonexistent"
command=env -u LOOM_COMPUTER_TOKEN /opt/loom-computer/image/wait-for-x chromium
  --no-sandbox --test-type --disable-dev-shm-usage --disable-gpu --no-first-run
  --no-default-browser-check --password-store=basic
  --disable-background-networking --disable-component-update --disable-sync
  --user-data-dir=/home/agent/.config/loom-chromium
  --window-position=0,0 --window-size=1280,800 about:blank
priority=40
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
