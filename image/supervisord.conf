; The desktop's process tree. Everything runs as the unprivileged agent user
; (the image's USER); nothing here needs or asks for root. The API is not
; here: loom_computer.init runs it next to this, so it can keep the token
; unreadable (see that module).
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; The token is already absent from this environment; each program strips it
; again so a future change to the parent cannot leak it.
[program:xvfb]
command=env -u LOOM_COMPUTER_TOKEN Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=env -u LOOM_COMPUTER_TOKEN /opt/loom-computer/image/wait-for-x openbox --config-file /opt/loom-computer/image/openbox-rc.xml
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chromium]
environment=DBUS_SESSION_BUS_ADDRESS="unix:path=/nonexistent"
command=env -u LOOM_COMPUTER_TOKEN /opt/loom-computer/image/wait-for-x chromium
  --no-sandbox --test-type --disable-dev-shm-usage --disable-gpu --no-first-run
  --no-default-browser-check --password-store=basic
  --disable-background-networking --disable-component-update --disable-sync
  --user-data-dir=/home/agent/.config/loom-chromium
  --window-position=0,0 --window-size=1280,800 about:blank
priority=40
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
